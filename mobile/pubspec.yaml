name: ecommerce_mobile_app
description: "E-commerce mobile application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # HTTP & API
  dio: ^5.7.0
  
  # Data Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Barcode Scanning
  mobile_scanner: ^7.2.0
  
  # Camera & Photos
  image_picker: ^1.0.4

  # Permissions
  permission_handler: ^11.1.0

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Offline Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Push Notifications
  firebase_messaging: ^15.1.0
  firebase_core: ^3.4.0
  
  # Navigation
  go_router: ^14.6.1
  
  # Functional Programming
  dartz: ^0.10.1
  equatable: ^2.0.5
  
  # Logging
  logger: ^2.4.0
  
  # Cookie Management
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  
  # UI Components
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true