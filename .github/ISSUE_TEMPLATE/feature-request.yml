name: Feature Request
description: Propose a new feature or capability
labels: ["type:feature"]
body:
  - type: input
    id: title
    attributes:
      label: Feature Title
      description: Short, descriptive name for this feature
      placeholder: e.g., "Add bulk price update for eBay listings"
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: Which area of the application does this feature belong to?
      options:
        - Auth & Organization
        - Fulfillment
        - Inventory
        - Marketplace - eBay
        - Marketplace - Shopify
        - Marketplace - Amazon
        - Intake Queue
        - Analytics
        - Procurement
        - Pricing
        - Customer
        - Communication
        - Marketing
        - Supplier
        - Catalog & Bundles
        - Part-Out
        - Warehouse
        - Printing
        - Dashboard
        - Notifications
        - Settings
        - Admin
        - CI/CD & Infrastructure
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform(s) does this feature target?
      multiple: true
      options:
        - Web
        - Mobile
        - API
        - Infrastructure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the feature and the problem it solves
      placeholder: |
        What problem does this solve?
        Who benefits from this feature?
        How should it work at a high level?
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: What must be true for this feature to be considered complete?
      placeholder: |
        - [ ] User can ...
        - [ ] System should ...
        - [ ] Data is persisted to ...
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: Mockup / Screenshot
      description: Attach any wireframes, mockups, or reference screenshots
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, links, or references
    validations:
      required: false
